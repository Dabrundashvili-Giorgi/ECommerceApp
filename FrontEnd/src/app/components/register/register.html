<div class="register-container">
  <h2>📝 რეგისტრაცია</h2>

  <form (ngSubmit)="onSubmit()" class="register-form">
    <input 
      type="text" 
      [(ngModel)]="email" 
      name="email" 
      placeholder="მომხმარებელი ან Email" 
      required 
    />

    <input 
      type="password" 
      [(ngModel)]="password" 
      name="password" 
      placeholder="პაროლი"
      (input)="onPasswordInput()" 
      (focus)="showRules = true"
      (blur)="showRules = false"
      required 
    />

    <!-- წესები გამოჩნდება მხოლოდ როცა პაროლის ველი აქტიურია -->
    <div class="password-rules" *ngIf="showRules">
      <p [class.valid]="hasUpper">• მინ. ერთი დიდი ასო (A–Z)</p>
      <p [class.valid]="hasNumber">• მინ. ერთი რიცხვი (0–9)</p>
      <p [class.valid]="password.length >= 4">• მინ. 4 სიმბოლო</p>
    </div>

    <input 
      type="password" 
      [(ngModel)]="confirmPassword" 
      name="confirmPassword" 
      placeholder="გაიმეორეთ პაროლი"
      required 
    />

    <button type="submit" [disabled]="!isPasswordValid()">რეგისტრაცია</button>
  </form>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <p class="bottom-link">
    გაქვს უკვე ანგარიში? 
    <a routerLink="/login">შესვლა</a>
  </p>
</div>
