<div class="admin-section">
  <h3>🛒 პროდუქტების მართვა</h3>

  <form (ngSubmit)="saveProduct()" class="admin-form">
    <input type="text" [(ngModel)]="newProduct.name" name="name" placeholder="დასახელება" required>
    <textarea [(ngModel)]="newProduct.description" name="description" placeholder="აღწერა"></textarea>

    <div class="form-row">
      <input type="text" [(ngModel)]="newProduct.category" name="category" placeholder="კატეგორია">
      <input type="text" [(ngModel)]="newProduct.weight" name="weight" placeholder="წონა">
    </div>

    <input type="number" [(ngModel)]="newProduct.price" name="price" placeholder="ფასი ₾">

    <input type="text" [(ngModel)]="newProduct.imageUrl" name="imageUrl" placeholder="ფოტოს ბმული (სტრინგად)">

    <div class="form-row check">
      <label><input type="checkbox" [(ngModel)]="newProduct.isAvailable" name="isAvailable"> მარაგშია</label>
      <label><input type="checkbox" [(ngModel)]="newProduct.isVegetarian" name="isVegetarian"> ვეგეტარიანული</label>
    </div>

    <button type="submit" class="save-btn">
      {{ editingProduct ? 'განახლება' : 'დამატება' }}
    </button>

    <button *ngIf="editingProduct" type="button" class="cancel-btn" (click)="cancelEdit()">გაუქმება</button>
  </form>

  <h4>📋 პროდუქტების სია</h4>
  <table class="admin-table">
    <thead>
      <tr>
        <th>ფოტო</th>
        <th>დასახელება</th>
        <th>ფასი</th>
        <th>კატეგორია</th>
        <th>მოქმედება</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of products">
        <td><img [src]="p.imageUrl || 'assets/images/no-image.png'" width="70"></td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }} ₾</td>
        <td>{{ p.category }}</td>
        <td>
          <button class="edit" (click)="editProduct(p)">✏️</button>
          <button class="delete" (click)="deleteProduct(p.id!)">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
