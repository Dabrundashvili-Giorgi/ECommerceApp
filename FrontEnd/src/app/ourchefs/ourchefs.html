<section class="our-chefs-component">
  <div class="background-overlay"></div>
  <div class="content-wrapper">
    <div class="section-header">
      <h2 class="section-title">გაიცანით ჩვენი შეფ-მზარეულები</h2>
      <p class="section-subtitle">რა შეიძლება იყოს სიყვარულით მომზადებულ საჭმელზე უკეთესი 😉</p>
    </div>

    <div class="swiper-container-wrapper">
      <div class="swiper ourchefs-swiper">
<div class="swiper-wrapper">
  <div class="swiper-slide" *ngFor="let chef of chefs">
    <div class="chef-card">
      <div class="image-wrapper">
        <img [src]="chef.imageUrl || 'assets/images/no-image.png'" [alt]="chef.name">

        <div class="chef-overlay">
          <p>{{ chef.description || 'მოკლე ინფორმაცია შეფზე მალე დაემატება.' }}</p>
        </div>
      </div>

      <div class="info-wrapper">
        <h3>{{ chef.name }}</h3>
        <p class="role">{{ chef.specialty }}</p>
        <div class="stars">
          <i class="fas fa-star filled"></i>
          <i class="fas fa-star filled"></i>
          <i class="fas fa-star filled"></i>
          <i class="fas fa-star filled"></i>
          <i class="fas fa-star"></i>
        </div>

        <div class="socials">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>

        <a href="#" class="profile-link">პროფილის ნახვა</a>
      </div>
    </div>
  </div>
</div>

      </div>

      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>

    <div class="section-footer">
      <a href="#" class="our-chefs-btn">ჩვენი შეფ-მზარეულები</a>
    </div>
  </div>
</section>
